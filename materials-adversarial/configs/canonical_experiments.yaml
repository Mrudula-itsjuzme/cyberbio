    description: >
      8-experiment leakage-free benchmark: 4 defense configs x 2 split strategies.
      Primary canonical result for the bandgap lineage.
    status: VERIFIED
    git_commit: 3256c9f27e8cf44bf97e92b10c62dd4ec24ec228
    key_metrics:
      RandomSplit_Baseline:
        clean_mae_eV: 0.4627
        clean_rmse_eV: 0.6007
        clean_r2: 0.8170
        rand_smiles_drift_mean_eV: 0.5991
        mcmc_drift_mean_eV: 0.2085
      RandomSplit_RandSmilesAug:
        clean_mae_eV: 0.4622
        clean_rmse_eV: 0.5962
        clean_r2: 0.8197
        rand_smiles_drift_mean_eV: 0.3257
        mcmc_drift_mean_eV: 0.1609
      ScaffoldSplit_Baseline:
        clean_mae_eV: 0.5149
        clean_rmse_eV: 0.6998
        clean_r2: 0.7730
        rand_smiles_drift_mean_eV: 0.8968
        mcmc_drift_mean_eV: 0.2218
      ScaffoldSplit_RandSmilesAug:
        clean_mae_eV: 0.4956
        clean_rmse_eV: 0.6630
        clean_r2: 0.7963
        rand_smiles_drift_mean_eV: 0.4079
        mcmc_drift_mean_eV: 0.2047

  - artifact: results/phase2_paired_benchmark/paired_robustness.json
    description: Frozen candidate bank evaluation on sealed 632-sample test set.
    status: VERIFIED
    git_commit: 3256c9f27e8cf44bf97e92b10c62dd4ec24ec228
    model_hash_baseline: 0b1bb3f62ca72a897fd84c8e7f3129f8a7a9d75c1179c10debb63e46113731e4
    model_hash_defended: bda109bd0bd7f7843c803ec31c842a5ed1190ed4714e1448e42c28d0c9e7c484

  - artifact: results/models/transformer_regressor/metrics.json
    description: Baseline model clean performance on sealed test set.
    status: VERIFIED
    metrics:
      test_mae_eV: 0.4619
      test_rmse_eV: 0.6235
      test_r2: 0.8019
      seed: 20260815

# ---------------------------------------------------------------------------
# Multi-Seed Status
# ---------------------------------------------------------------------------
multiseed:
  bandgap_multiseed_status: MISSING
  bandgap_multiseed_note: >
    No multi-seed experiment with saved bandgap checkpoints has been executed.
    The 5-seed data in results/phase2c/ is the historical Tg lineage — do not
    use as evidence for bandgap claims.
  seeds_proposed: [42, 123, 2026, 777, 999]
  historical_tg_multiseed_artifact: "results/phase2c/ (DO NOT MIX with bandgap)"
  run_command: "PYTHONPATH=. python scripts/run_representation_multiseed.py --config configs/canonical_experiments.yaml"

# ---------------------------------------------------------------------------
# Deprecated Experiments
# ---------------------------------------------------------------------------
deprecated:
  - name: OpenPoly_Tg_All
    artifacts:
      - results/models/transformer_regressor_mcmc_defended
      - results/models/transformer_regressor_residualized
      - results/models/transformer_defended_phase2b
      - results/models/transformer_defended_phase2b_balanced
      - results/phase2c/
    reason: Historical Tg (K) lineage, superseded by polyVERSE bandgap (eV)
    documented_in: docs/HISTORICAL_TG_LINEAGE.md

  - name: Phase9_ClosedLoop_Repr_Training
    artifact: results/phase9_representation_closed_loop/
    reason: "Output collapse R2=0.142, adversarial overfitting 4x. Verdict: NOT SUPPORTED."
    documented_in: docs/PHASE9_REPRESENTATION_CLOSED_LOOP.md

# ---------------------------------------------------------------------------
# Reproducibility Commands
# ---------------------------------------------------------------------------
reproducibility:
  smoke_test:
    command: "PYTHONPATH=. python scripts/smoke_test_attack.py"
    cwd: materials-adversarial/

  full_validation:
    command: "PYTHONPATH=. python scripts/run_validation_pass.py"
    cwd: materials-adversarial/
    note: Reproduces canonical_benchmark_no_leakage.json (in-memory training)

  paired_benchmark:
    command: "PYTHONPATH=. python scripts/run_phase2_paired_benchmark.py"
    cwd: materials-adversarial/

  multiseed_representation:
    command: "PYTHONPATH=. python scripts/run_representation_multiseed.py --config configs/canonical_experiments.yaml"
    cwd: materials-adversarial/

  tests:
    command: "PYTHONPATH=. pytest tests/ -q"
    cwd: materials-adversarial/

  generate_tables:
    command: "PYTHONPATH=. python scripts/generate_final_tables.py"
    cwd: materials-adversarial/
    output_dir: results/final/

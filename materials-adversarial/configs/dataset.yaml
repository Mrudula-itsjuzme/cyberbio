# Active Dataset Configuration
#
# Dataset: polyVERSE (Ramprasad Group)
# Target: Polymer Bandgap (eV)

name: polyverse_bandgap
raw_dir: data/raw
processed_dir: data/processed

file: bandgap_chain.csv
representation_column: "smiles"
target_property: "Bandgap"
target_column: "bandgap_chain"
target_units: "eV"
n_usable_records: 4209

# Duplicate handling & conflict resolution
duplicate_policy: drop_all          # "keep_first" | "mean" | "drop_all"
conflict_tolerance: 1.0             # target units (eV)

# --- Splitting Specifications ---
split:
  strategy: random                  # deterministic shuffle used by split_dataset.py
  train: 2946
  validation: 631
  test: 632
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 20260815
  artifact: data/processed/splits.json
  # The test set is SEALED: attacks are developed against validation only.
  test_sealed: true

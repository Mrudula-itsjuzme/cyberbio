# Dataset configuration
#
# STATUS: resolved for the active polyVERSE bandgap lineage. Historical
# OpenPoly/Tg experiments use different schemas and must not reuse this config.

name: polyverse_bandgap
raw_dir: data/raw
processed_dir: data/processed

file: bandgap_chain.csv
representation_column: "smiles"
target_property: "Bandgap"
target_column: "bandgap_chain"
target_units: "eV"
n_usable_records: 4209

# Duplicate handling. Mean / keep-first / drop are NOT equivalent choices, and
# one likely cause of conflict is a Kelvin/Celsius mix -- averaging those would
# manufacture a value wrong in both units.
duplicate_policy: drop_all          # "keep_first" | "mean" | "drop_all"
conflict_tolerance: 1.0         # target units; conflicts above this need a decision

# --- Splitting ---
split:
  strategy: random              # deterministic shuffle used by split_dataset.py
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 20260815
  artifact: data/processed/splits.json
  # The test set is SEALED: attacks are developed against validation only.
  test_sealed: true
